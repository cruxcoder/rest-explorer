swagger: "2.0"
info:
  title: Sample API
  version: 1.0.0
host: api.example.com
basePath: /v1
schemes:
  - https
securityDefinitions:
  apiKeyAuth:
    type: apiKey
    in: header
    name: X-API-Key
paths:
  /users:
    get:
      summary: List users
      parameters:
        - name: email
          in: query
          type: string
          required: false
          description: Filter by email address
      responses:
        "200":
          description: Success
          schema:
            type: array
            items:
              $ref: "#/definitions/User"
    post:
      summary: Create user
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/User"
      responses:
        "201":
          description: Created
      security:
        - apiKeyAuth: []
  /users/{id}:
    parameters:
      - name: id
        in: path
        type: integer
        required: true
        description: The user's unique identifier
    get:
      summary: Get user by ID
      parameters:
        - name: email
          in: query
          type: string
          required: false
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/User"
        "404":
          description: Not found
definitions:
  User:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      email:
        type: string
